<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0eb">
<title>Treeclock · 专注养树</title>
<style>
  :root{
    --bg:#f5f0eb;--paper:#fffdf9;--ink:#2c2416;--sub:#7a7166;
    --faint:#b0a89c;--gold:#c4956a;--gold-dark:#a67c52;
    --sage:#8fb0a0;--sage-dark:#6d8d7d;--border:#e8e0d8;
    --shadow:0 12px 36px rgba(83,65,42,.065);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{min-height:100%;background:var(--bg)}
  body{margin:0;min-height:100vh;min-height:100svh;color:var(--ink);background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  button,input,select{font:inherit}
  button{cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{
    outline:2px solid var(--sage-dark);outline-offset:3px}
  .background{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .background::before{content:"";position:absolute;inset:0;background:
    radial-gradient(ellipse at 15% 20%,rgba(255,255,255,.83),transparent 34%),
    radial-gradient(ellipse at 85% 74%,rgba(143,176,160,.085),transparent 36%),
    linear-gradient(170deg,#fdfbf8 0%,#f5f0eb 60%,#f0e8db 100%)}
  .background::after{content:"";position:absolute;left:-12%;right:-12%;bottom:-130px;height:340px;
    border-radius:50% 50% 0 0;background:linear-gradient(180deg,rgba(228,217,200,.09),rgba(222,208,185,.23));transform:rotate(-4deg)}
  .deco{position:absolute;display:block;border:1px solid rgba(160,138,105,.08);border-radius:50%}
  .deco.a{width:420px;height:420px;top:-215px;left:-205px}
  .deco.b{width:470px;height:470px;bottom:-300px;right:-180px}
  .deco.c{width:720px;height:720px;top:6%;left:calc(50% - 360px);border-color:rgba(160,138,105,.035)}
  .app{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:20px 20px 40px}
  .topbar{width:min(1060px,100%);display:flex;justify-content:space-between;align-items:center;min-height:43px}
  .brand{font-family:"LXGW WenKai","Noto Serif SC",serif;letter-spacing:.07em;font-weight:600;font-size:18px;display:flex;gap:9px;align-items:center}
  .brand-bloom{color:var(--sage-dark);font-size:22px}
  .back{font-size:13px;color:var(--sub);text-decoration:none;padding:10px 14px;background:rgba(255,255,255,.58);border:1px solid var(--border);border-radius:100px}
  .back:hover{color:var(--ink);background:white}
  .main{width:min(670px,100%);display:flex;align-items:center;flex-direction:column;text-align:center;margin:9px auto 0}
  .eyebrow{color:var(--gold-dark);font-size:11px;letter-spacing:.29em;font-weight:600;margin-bottom:5px}
  .date{font-family:"LXGW WenKai","Noto Serif SC",serif;font-size:30px;font-weight:500;letter-spacing:.085em;line-height:1.4}
  .weekday{font-size:12px;letter-spacing:.15em;color:var(--faint);margin-top:1px}
  .quote{margin:16px 0 9px;width:min(590px,100%);min-height:54px;background:rgba(255,253,249,.74);
    border:1px solid rgba(196,149,106,.14);box-shadow:0 7px 28px rgba(83,65,42,.025);
    border-radius:17px;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 18px;flex-wrap:wrap}
  .quote-label{flex-shrink:0;font-size:11px;letter-spacing:.04em;color:var(--gold-dark);font-weight:700}
  .quote-text{font-size:13px;letter-spacing:.025em;line-height:1.7;color:#695b4d}

  /* Minimal command-palette style for quote categories */
  .quote-picker{position:relative;flex-shrink:0}
  .quote-trigger{display:inline-flex;align-items:center;gap:5px;color:var(--sage-dark);
    background:rgba(143,176,160,.085);border:1px solid rgba(143,176,160,.12);
    border-radius:9px;padding:6px 9px;font-size:11px;white-space:nowrap;line-height:1.3}
  .quote-trigger:hover,.quote-trigger[aria-expanded="true"]{background:rgba(143,176,160,.16)}
  .quote-menu{position:absolute;z-index:100;top:calc(100% + 12px);right:0;
    width:min(345px,calc(100vw - 36px));padding:9px;
    background:rgba(255,253,249,.985);border:1px solid #e8e0d8;border-radius:18px;
    box-shadow:0 17px 50px rgba(47,40,30,.15),0 2px 12px rgba(47,40,30,.05);
    text-align:left;backdrop-filter:blur(16px)}
  .quote-menu[hidden]{display:none}
  .quote-search-wrap{display:flex;align-items:center;gap:9px;padding:9px 12px;
    border-bottom:1px solid #eee8df;color:#a09382}
  .quote-search-wrap input{border:0;min-width:0;flex:1;color:var(--ink);background:transparent;
    outline:none;font-size:13px;letter-spacing:.01em}
  .quote-search-wrap input::placeholder{color:#aca093}
  .quote-key{font-size:10px;padding:3px 5px;border:1px solid #eae2d8;
    border-radius:5px;color:#a09281}
  .quote-menu-label{padding:10px 12px 6px;font-size:10px;letter-spacing:.1em;
    color:#ab9d8d;font-weight:700}
  .quote-option{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    padding:10px 11px;border:0;border-radius:10px;background:none;color:#655747;
    font-size:13px;transition:background .16s;cursor:pointer}
  .quote-option:hover,.quote-option:focus-visible{background:#f3f4ed;outline:none}
  .quote-option.is-selected{background:#eff3ec;color:#536b59}
  .quote-option-icon{width:28px;height:28px;border-radius:9px;flex-shrink:0;
    display:grid;place-items:center;background:#eef0e7;color:#72947f;font-size:16px}
  .quote-option:nth-of-type(2) .quote-option-icon{background:#f8eee4;color:#b58c65}
  .quote-option:nth-of-type(3) .quote-option-icon{background:#f5eef3;color:#ab839f}
  .quote-option:nth-of-type(4) .quote-option-icon{background:#f0eff7;color:#8983a8}
  .quote-option:nth-of-type(5) .quote-option-icon{background:#f1ede7;color:#968069}
  .quote-option-title{font-weight:600;font-size:13px}
  .quote-option-desc{font-size:11px;color:#a0988d;margin-top:2px}
  .quote-option-check{margin-left:auto;font-size:13px;color:#7b9d88}
  .quote-no-match{font-size:12px;color:#a99d8d;padding:15px 12px}
  @media(max-width:500px){.quote{position:relative}.quote-menu{right:-10px}.quote-trigger{padding:5px 7px}}

  .tree-area{position:relative;width:min(356px,87vw);height:min(356px,87vw);margin:0 auto 0;
    display:grid;place-items:center;isolation:isolate}
  .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .ring-bg{fill:none;stroke:rgba(196,149,106,.16);stroke-width:5}
  .ring-fg{fill:none;stroke:url(#treeProgress);stroke-width:6;stroke-linecap:round;
    stroke-dasharray:1005.30965;stroke-dashoffset:1005.30965;
    transition:stroke-dashoffset .38s linear}
  .tree-halo{position:absolute;width:80%;height:80%;border-radius:50%;background:
    radial-gradient(circle at 45% 55%,rgba(255,255,255,.95),rgba(255,253,247,.65) 55%,rgba(255,253,247,0) 78%)}
  .tree-stage{position:relative;display:grid;place-items:center;width:87%;height:87%;pointer-events:none}
  #treeImage{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(69,64,41,.055));
    animation:tree-breathe 7s ease-in-out infinite;transform-origin:50% 82%}
  #treeImage.switch{animation:tree-arrive .65s cubic-bezier(.19,1,.22,1) both}
  @keyframes tree-breathe{0%,100%{transform:translateY(0) rotate(-.45deg)}50%{transform:translateY(-3px) rotate(.45deg)}}
  @keyframes tree-arrive{from{opacity:.16;transform:translateY(8px) scale(.91)}to{opacity:1;transform:translateY(0) scale(1)}}
  .small-leaf{position:absolute;color:rgba(143,176,160,.58);font-size:15px;animation:leaf-float 7s ease-in-out infinite}
  .small-leaf.one{top:18%;left:3%}.small-leaf.two{right:3%;top:58%;animation-delay:-3s;font-size:12px}
  @keyframes leaf-float{0%,100%{transform:translate(0,0) rotate(-18deg)}50%{transform:translate(4px,7px) rotate(15deg)}}
  .phase-hint{display:flex;align-items:center;gap:8px;margin-top:-4px;z-index:2;color:var(--sage-dark);
    font-size:12px;letter-spacing:.12em;white-space:nowrap}
  .phase-hint::before,.phase-hint::after{content:"";display:block;width:20px;height:1px;background:var(--sage);opacity:.6}
  .time{font-size:52px;letter-spacing:.055em;font-weight:400;line-height:1.24;
    font-family:"JetBrains Mono","SF Mono",Consolas,monospace;font-variant-numeric:tabular-nums;margin-top:5px}
  .phase{font-size:12px;letter-spacing:.2em;color:var(--sub)}
  .controls{display:flex;align-items:center;gap:19px;margin-top:16px}
  .ctrl{width:47px;height:47px;display:grid;place-items:center;border:1px solid #eadfd1;border-radius:50%;
    background:rgba(255,255,255,.85);color:#7e6b59;font-size:24px;transition:transform .18s,box-shadow .18s,background .18s}
  .ctrl:hover{background:#fff;box-shadow:0 5px 20px rgba(82,58,32,.09);transform:translateY(-2px)}
  .ctrl.primary{width:66px;height:66px;background:var(--gold);color:white;border:0;
    box-shadow:0 6px 19px rgba(196,149,106,.29);font-size:26px}
  .ctrl.primary:hover{background:var(--gold-dark)}
  .ctrl:active{transform:scale(.96)}
  .settings{display:grid;grid-template-columns:repeat(3,1fr);margin-top:24px;
    width:min(570px,100%);padding:17px 12px;background:rgba(255,253,249,.81);
    border:1px solid rgba(196,149,106,.15);border-radius:19px;box-shadow:var(--shadow)}
  .setting{display:flex;justify-content:center;align-items:center;gap:8px;min-width:0}
  .setting:not(:last-child){border-right:1px solid var(--border)}
  .setting label{display:flex;align-items:center;gap:8px;color:#77695a;font-size:13px}
  .setting input{width:53px;height:34px;text-align:center;border:1px solid #e8d9c8;border-radius:9px;
    background:#f4ede4;color:#665140;font-family:Consolas,monospace;font-size:16px;font-variant-numeric:tabular-nums}
  .unit{font-size:11px;color:#a3998d}
  .counter{margin-top:16px;font-size:13px;color:#958776;letter-spacing:.06em}
  .counter strong{font-weight:700;color:var(--sage-dark)}
  .status{min-height:20px;margin-top:7px;font-size:11px;color:var(--faint)}
  .steps{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:15px;flex-wrap:wrap}
  .step{font-size:11px;color:#a89a89;display:flex;align-items:center;gap:5px}
  .step::before{content:"";width:6px;height:6px;border-radius:50%;background:#d7c9bb}
  .step.active{color:var(--sage-dark);font-weight:600}.step.active::before{background:var(--sage-dark)}
  .step.done::before{background:var(--gold)}
  body.break-mode .ctrl.primary{background:var(--sage-dark);box-shadow:0 6px 19px rgba(109,141,125,.22)}
  body.break-mode .ring-fg{stroke:var(--sage)}
  @media(max-width:500px){
    .app{padding:13px 14px 35px}.brand{font-size:15px}.back{font-size:11px;padding:8px 10px}
    .main{margin-top:17px}.date{font-size:26px}.quote{margin-top:12px;margin-bottom:10px;padding:11px;gap:6px}
    .quote-text{font-size:12px}.tree-area{width:min(315px,83vw);height:min(315px,83vw)}
    .time{font-size:46px}.settings{gap:0;padding:13px 3px}.setting label{font-size:11px;flex-wrap:wrap;justify-content:center;gap:4px}
    .setting input{width:48px;height:32px}.unit{font-size:10px}.steps{gap:8px}
  }
  @media(max-height:760px) and (min-width:550px){
    .main{margin-top:0}.quote{margin-top:9px;margin-bottom:0;min-height:43px}
    .tree-area{width:285px;height:285px}.settings{margin-top:14px;padding:11px}.controls{margin-top:10px}
    .steps{margin-top:9px}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  /* Approved watercolor-paper/edge-leaf background only; all original Treeclock widgets untouched. */
  .background::before,.background::after{display:none}

          <span aria-hidden="true">⌄</span>
        </button>
        <div class="quote-menu" id="quoteMenu" hidden>
          <div class="quote-search-wrap">
            <span aria-hidden="true">⌕</span>
            <input id="quoteSearch" placeholder="搜索文案风格…" autocomplete="off" aria-label="搜索文案风格">
            <span class="quote-key" aria-hidden="true">ESC</span>
          </div>
          <div class="quote-menu-label">文案风格 · 选择一种心情</div>
          <div id="quoteOptions" role="group" aria-label="文案风格列表"></div>
        </div>
      </div>
    </div>

      <div class="tree-halo"></div>
      <svg class="ring" viewBox="0 0 360 360" aria-hidden="true">
        <defs><linearGradient id="treeProgress" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8fb0a0"/><stop offset="1" stop-color="#c4956a"/>
        </linearGradient></defs>
        <circle class="ring-bg" cx="180" cy="180" r="160"/>
        <circle class="ring-fg" id="ringFg" cx="180" cy="180" r="160"/>
      </svg>

      <span class="small-leaf two" aria-hidden="true">✧</span>
    </div>

    <div class="time" id="timeDisplay" role="timer" aria-live="off">25:00</div>
    <div class="phase" id="phaseLabel">专注</div>
    <div class="controls" aria-label="计时控制">
      <button class="ctrl" id="resetBtn" type="button" aria-label="重置当前计时" title="重置 (R)">↺</button>
      <button class="ctrl primary" id="mainBtn" type="button" aria-label="开始计时" title="开始或暂停 (空格)">▶</button>
      <button class="ctrl" id="skipBtn" type="button" aria-label="跳过当前阶段" title="跳过 (S)">⏭</button>
    </div>

  sessionCountEl.textContent=state.sessions;
  const quoteStyleBtn=$('quoteStyleBtn'),quoteStyleName=$('quoteStyleName');
  const quoteMenu=$('quoteMenu'),quoteSearch=$('quoteSearch'),quoteOptions=$('quoteOptions');
  const quotePicker=$('quotePicker');
  const styleSpecs=[
    {name:'森林疗愈',icon:'❧',desc:'安静的森林与自我照顾'},
    {name:'学习陪伴',icon:'✎',desc:'把知识慢慢积累起来'},
    {name:'轻盈鼓励',icon:'✧',desc:'温柔而不过度的鼓励'},
    {name:'诗意自然',icon:'❀',desc:'带着诗意看待时间'},
    {name:'务实专注',icon:'◈',desc:'只把眼前一件事做好'}
  ];
  let currentStyle='森林疗愈';
  try{const s=localStorage.getItem('treeclock-quote-style');if(styleSpecs.some(x=>x.name===s))currentStyle=s;}catch(e){}
  quoteStyleName.textContent=currentStyle;
  const weekdays=['日','一','二','三','四','五','六'];
  const today=new Date();
  dateDisplay.textContent=`${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  weekdayDisplay.textContent=`星期${weekdays[today.getDay()]}`;
  function chooseQuote(){
    const list=quotes[currentStyle]||fallbackQuotes['森林疗愈'];
    const key=todayKey()+currentStyle;
    let hash=0;for(const ch of key)hash=((hash*31)+ch.codePointAt(0))|0;
    fortuneDisplay.textContent=list[Math.abs(hash)%list.length];
  }
  function renderQuoteOptions(term=''){
    quoteOptions.replaceChildren();
    const filter=term.trim().toLowerCase();
    const matches=styleSpecs.filter(s=>(s.name+s.desc).toLowerCase().includes(filter));
    for(const s of matches){
      const btn=document.createElement('button');
      btn.type='button';btn.className='quote-option'+(s.name===currentStyle?' is-selected':'');
      const symbol=document.createElement('span');symbol.className='quote-option-icon';symbol.textContent=s.icon;
      const body=document.createElement('span');
      const title=document.createElement('div');title.className='quote-option-title';title.textContent=s.name;
      const desc=document.createElement('div');desc.className='quote-option-desc';desc.textContent=s.desc;
      body.append(title,desc);
      btn.append(symbol,body);
      if(s.name===currentStyle){const check=document.createElement('span');check.className='quote-option-check';check.textContent='✓';btn.appendChild(check);}
      btn.addEventListener('click',()=>{
        currentStyle=s.name;quoteStyleName.textContent=s.name;
        try{localStorage.setItem('treeclock-quote-style',s.name);}catch(e){}
        chooseQuote();closeQuoteMenu();quoteStyleBtn.focus();
      });
      quoteOptions.appendChild(btn);
    }
    if(!matches.length){const hint=document.createElement('div');hint.className='quote-no-match';hint.textContent='没有找到这个风格';quoteOptions.append(hint);}
  }
  function openQuoteMenu(){
    quoteSearch.value='';renderQuoteOptions();quoteMenu.hidden=false;
    quoteStyleBtn.setAttribute('aria-expanded','true');quoteSearch.focus();
  }
  function closeQuoteMenu(){quoteMenu.hidden=true;quoteStyleBtn.setAttribute('aria-expanded','false');}
  quoteStyleBtn.addEventListener('click',()=>quoteMenu.hidden?openQuoteMenu():closeQuoteMenu());
  quoteSearch.addEventListener('input',()=>renderQuoteOptions(quoteSearch.value));
  quoteSearch.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const first=quoteOptions.querySelector('.quote-option');if(first){e.preventDefault();first.click();}}
    if(e.key==='ArrowDown'){e.preventDefault();quoteOptions.querySelector('.quote-option')?.focus();}
  });
  quoteOptions.addEventListener('keydown',e=>{
    if(!['ArrowDown','ArrowUp'].includes(e.key))return;
    e.preventDefault();const options=[...quoteOptions.querySelectorAll('.quote-option')];
    const idx=options.indexOf(document.activeElement);
    options[(idx+(e.key==='ArrowDown'?1:-1)+options.length)%options.length]?.focus();
  });
  document.addEventListener('pointerdown',e=>{if(!quoteMenu.hidden&&!quotePicker.contains(e.target))closeQuoteMenu();});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&!quoteMenu.hidden){e.preventDefault();closeQuoteMenu();quoteStyleBtn.focus();}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
      e.preventDefault();if(quoteMenu.hidden)openQuoteMenu();else closeQuoteMenu();
    }
  });
  chooseQuote();
  fetch('./treeclock/quotes.json').then(r=>{if(!r.ok)throw Error('Quotes not found');return r.json()})
    .then(data=>{if(data&&typeof data==='object')quotes={...fallbackQuotes,...data};chooseQuote();})
    .catch(()=>{});
  function fmtTime(seconds){const t=Math.max(0,Math.ceil(seconds));return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;}
  const clamp=(v,min,max,fallback)=>Number.isFinite(v)?Math.max(min,Math.min(max,Math.round(v))):fallback;
  function readSettings(){
    state.workDuration=clamp(Number(workInput.value),1,120,25)*60;
    state.breakDuration=clamp(Number(breakInput.value),1,60,5)*60;
    state.longBreakDuration=clamp(Number(longBreakInput.value),1,90,15)*60;
    workInput.value=state.workDuration/60;breakInput.value=state.breakDuration/60;
    longBreakInput.value=state.longBreakDuration/60;
  }
  function phaseDuration(phase){return phase==='work'?state.workDuration:phase==='break'?state.breakDuration:state.longBreakDuration;}
  function stageIndex(){
    if(state.phase!=='work')return 3;
    const progress=state.total?Math.min(1,Math.max(0,(state.total-state.remaining)/state.total)):0;
    return progress<.25?0:progress<.5?1:progress<.8?2:3;
  }
  function renderTree(){
    const current=stageIndex();
    if(current===state.stage)return;
    state.stage=current;
    const s=treeStages[current];
    treeImage.src='./treeclock/'+s.file;
    treeImage.alt=s.alt;
    growthLabel.textContent=state.phase==='work'?s.label:'树在休息，枝叶轻轻摇曳';
    treeImage.classList.remove('switch');void treeImage.offsetWidth;treeImage.classList.add('switch');
    steps.forEach((el,index)=>{
      el.classList.toggle('active',index===current);
      el.classList.toggle('done',index<current);
    });
  }
  function render(){
    timeDisplay.textContent=fmtTime(state.remaining);
    phaseLabel.textContent=state.phase==='work'?'专注':state.phase==='break'?'短休息':'长休息';
    document.body.classList.toggle('break-mode',state.phase!=='work');
    const progress=state.total?Math.max(0,Math.min(1,(state.total-state.remaining)/state.total)):0;
    ringFg.style.strokeDashoffset=String(CIRCUMFERENCE*(1-progress));
    mainBtn.textContent=state.running?'Ⅱ':'▶';
    mainBtn.setAttribute('aria-label',state.running?'暂停计时':'开始计时');
    renderTree();
  }
  function stopTimer(){if(state.timerId!==null){clearInterval(state.timerId);state.timerId=null;}}
  function enterPhase(phase){
    state.phase=phase;
    state.total=phaseDuration(phase);
    state.remaining=state.total;
    state.stage=-1;
    state.endAt=0;
    render();
  }
  const SESSION_QUEUE_KEY='treeclock-pending-sessions-v1';
  function queueCompletedFocus(durationSec){
    // No Supabase credentials are exposed in this standalone HTML.
    // The main React app imports events into its existing time_records table.
    try{
      const saved=JSON.parse(localStorage.getItem(SESSION_QUEUE_KEY)||'[]');
      const queue=Array.isArray(saved)?saved:[];
      const ended=new Date();
      const duration=Math.max(1,Math.round(durationSec/60));
      queue.push({
        id:Date.now()*1000+Math.floor(Math.random()*1000),
        type:'学习',duration,
        startTime:new Date(ended.getTime()-duration*60000).toISOString(),
        endTime:ended.toISOString()
      });
      localStorage.setItem(SESSION_QUEUE_KEY,JSON.stringify(queue));
      statusText.textContent='小树长成了！返回主页后学习时间会同步。';
    }catch(error){
      console.error('[Treeclock] 无法保存学习记录',error);
      statusText.textContent='小树已长成，但学习记录未能写入本地，请检查存储权限。';
    }
  }
  function onPhaseComplete(natural){
    const wasWork=state.phase==='work';
    if(wasWork&&natural){
      state.sessions++;
      sessionCountEl.textContent=state.sessions;
      try{localStorage.setItem(countKey(),String(state.sessions))}catch(e){}
      queueCompletedFocus(state.total);
    }else{
      statusText.textContent=wasWork?'本轮未计入成树，下一轮继续。':'休息结束，准备种下新的一颗种子。';
    }
    const next=wasWork?(natural&&state.sessions%4===0?'longbreak':'break'):'work';
    enterPhase(next);
  }
  function tick(){
    if(!state.running)return;
    state.remaining=Math.max(0,(state.endAt-Date.now())/1000);
    render();
    if(state.remaining<=0){
      stopTimer();state.running=false;
      onPhaseComplete(true);
      // Preserve the original timer behavior: automatically start the next phase.
      startTimer();
    }
  }
  function startTimer(){
    if(state.running)return;
    if(!state.endAt){
      // A new phase, or an interval reset before first start.
      if(state.remaining<=0)state.remaining=state.total;
    }
    state.endAt=Date.now()+state.remaining*1000;
    state.running=true;
    state.timerId=setInterval(tick,250);
    statusText.textContent=state.phase==='work'?'正在为小树积累养分':'休息也是生长的一部分';
    render();
  }
  function pauseTimer(){
    if(!state.running)return;
    state.remaining=Math.max(0,(state.endAt-Date.now())/1000);
    stopTimer();state.running=false;state.endAt=0;
    statusText.textContent='已暂停，树会等你回来';
    render();
  }
  function resetTimer(){
    stopTimer();state.running=false;state.endAt=0;
    readSettings();enterPhase('work');
    statusText.textContent='新的一颗种子，等你开始';
  }
  function skipPhase(){
    const wasRunning=state.running;
    stopTimer();state.running=false;state.endAt=0;
    onPhaseComplete(false); // Skipping never counts as a completed tree.
    if(wasRunning)startTimer();else render();
  }
  mainBtn.addEventListener('click',()=>state.running?pauseTimer():startTimer());
  resetBtn.addEventListener('click',resetTimer);
  skipBtn.addEventListener('click',skipPhase);
  for(const el of [workInput,breakInput,longBreakInput])el.addEventListener('change',resetTimer);
  document.addEventListener('keydown',e=>{
    if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
    if(e.code==='Space'){e.preventDefault();mainBtn.click()}
    if(e.code==='KeyR'){e.preventDefault();resetBtn.click()}
    if(e.code==='KeyS'){e.preventDefault();skipBtn.click()}
  });
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
  render();
})();
</script>
</body>
</html>
